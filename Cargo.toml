# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "meshkeep"
version = "0.1.1"
edition = "2024"
description = "Always-on storing proxy and web client for MeshCore companion radios"
license = "AGPL-3.0-or-later"
repository = "https://github.com/M0LTE/meshkeep"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
futures-util = "=0.3.31"
getrandom = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-serial = "5.5.0"
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form"] }
tokio-tungstenite = "0.30.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
